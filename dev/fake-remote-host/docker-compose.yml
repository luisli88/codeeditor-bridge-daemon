services:
  fake-remote-host:
    build:
      context: ../..
      dockerfile: dev/fake-remote-host/Dockerfile
    ports:
      - "2222:22"
      - "8443:8443"
    environment:
      # See the long bind-mount comment below — entrypoint.sh drops this
      # into /etc/environment so it also reaches the interactive SSH
      # session you set the daemon up in, not just this container's PID 1.
      - CODEEDITOR_DATA_DIR=${HOME}/codeeditor-data
    volumes:
      # Docker-outside-of-Docker (not DinD) — `docker info`/`devpod up` run
      # from inside this container control the *real* Docker host, same
      # pattern as ../../Dockerfile (the daemon's own image). Anything you
      # `docker run` from an SSH session in here is a sibling of this
      # container, not nested inside it — its ports need their own -p on
      # the real host if you want to reach them.
      - /var/run/docker.sock:/var/run/docker.sock
      # `devpod up` (invoked from inside this container) asks the *real*
      # Docker host to bind-mount a Workspace's path into the sibling
      # container it creates — that only resolves if the path is real and
      # identical on both sides. A named volume's real path
      # (/var/lib/docker/volumes/<name>/_data) is NOT that path, so
      # `devpod up` fails with "bind source path does not exist:
      # /var/lib/codeeditor/workspaces/<id>" — confirmed by hand against a
      # real `devpod up`, not just reasoned through.
      #
      # ${HOME} (not /var/lib/codeeditor, unlike a real self-hosted
      # machine — see ../../README.md "Self-hosted") avoids needing sudo
      # on your own dev machine. It's NOT arbitrary: on Colima (this
      # machine's Docker backend — `docker context ls`), the VM's
      # virtiofs mount only maps UID/GID correctly for paths under the
      # real $HOME; a sibling path like /Users/Shared *looks* mounted
      # (`colima ssh -- ls /Users/Shared` shows it) but is root:root and
      # unwritable by any other UID — confirmed by hand, cost a failed
      # provisioning run to find. $HOME is also why CODEEDITOR_DATA_DIR
      # exists above: this value must stay identical inside the SSH
      # session you set the daemon up in below, and that session's own
      # $HOME is /home/developer (the `developer` Linux user), not this
      # Mac's $HOME — a bare $HOME there would silently break path parity
      # all over again.
      - ${HOME}/codeeditor-data/workspaces:${HOME}/codeeditor-data/workspaces
      - ${HOME}/codeeditor-data/secrets:${HOME}/codeeditor-data/secrets
