services:
  fake-remote-host:
    build:
      context: ../..
      dockerfile: dev/fake-remote-host/Dockerfile
    ports:
      - "2222:22"
      - "8443:8443"
    volumes:
      # Docker-outside-of-Docker (not DinD) — `docker info`/`devpod up` run
      # from inside this container control the *real* Docker host, same
      # pattern as ../../Dockerfile (the daemon's own image). Anything you
      # `docker run` from an SSH session in here is a sibling of this
      # container, not nested inside it — its ports need their own -p on
      # the real host if you want to reach them.
      - /var/run/docker.sock:/var/run/docker.sock
      # `devpod up` (invoked from inside this container) asks the *real*
      # Docker host to bind-mount a Workspace's path into the sibling
      # container it creates — resolved by that real host's own dockerd,
      # against *its own* filesystem, using the literal path string
      # `bridged` cloned into (`/var/lib/codeeditor/workspaces/<id>`, the
      # compiled-in --workspace-dir default — deliberately NOT overridden
      # anywhere, since a real self-hosted machine has no reason to ever
      # override it, and this container needs to behave exactly like one
      # once the guided setup wizard deploys onto it with unmodified
      # flags). A named volume's real path
      # (/var/lib/docker/volumes/<name>/_data) is NOT that literal string,
      # so `devpod up` fails with "bind source path does not exist:
      # /var/lib/codeeditor/workspaces/<id>" — confirmed by hand.
      #
      # This machine's Docker backend is Colima (`docker context ls`) —
      # its dockerd runs *inside a Linux VM*, not on macOS directly, so
      # the bind-mount source has to be real *inside that VM's own
      # filesystem*, not on macOS at all. Colima's default `mounts: []`
      # only auto-shares $HOME into the VM (confirmed: /Users/Shared
      # *looks* mounted there too but is root:root and unwritable — a
      # dead end tried first), and /var/lib isn't under $HOME — so
      # `/var/lib/codeeditor/{workspaces,secrets}` has to be created
      # directly inside the VM, once:
      #   colima ssh -- sudo mkdir -p /var/lib/codeeditor/workspaces /var/lib/codeeditor/secrets
      #   colima ssh -- sudo chown -R $(id -u):$(id -g) /var/lib/codeeditor
      # (Colima's VM allows passwordless sudo for its own default user by
      # default — confirmed by hand — so this needs no macOS admin
      # password, only whatever `colima ssh` itself needs.) A real
      # self-hosted machine (no DooD, no VM indirection) never needs any
      # of this — `bridged`'s own --workspace-dir/--secrets-dir defaults
      # already point at real, local directories there.
      - /var/lib/codeeditor/workspaces:/var/lib/codeeditor/workspaces
      - /var/lib/codeeditor/secrets:/var/lib/codeeditor/secrets
